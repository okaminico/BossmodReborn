name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本號 major[.minor[.build[.revision]]]（從分支手動觸發時必填；用 tag 觸發可留空,會取 tag 名）"
        required: false
        type: string
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get Environment Variables
        run: |
          $tag = "${{ inputs.version }}".Trim()
          if (-not $tag) {
            $ref = "${{ github.ref }}"
            if ($ref -notlike 'refs/tags/*') {
              throw "從分支觸發時必須在 inputs.version 填版本號 (github.ref=$ref)"
            }
            $tag = $ref -replace '^refs/tags/', '' -replace '^v', ''
          }
          if ($tag -notmatch '^\d+(\.\d+){0,3}$') {
            throw "版本號 '$tag' 不符合 major[.minor[.build[.revision]]]"
          }

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Download Dalamud (pinned TC-compatible build)
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"

      - name: Restore Nuget Packages
        run: dotnet restore BossMod\BossModReborn.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release BossMod\BossModReborn.csproj -p:Version=${{ env.tag }} -p:AssemblyVersion=${{ env.tag }} -p:FileVersion=${{ env.tag }} -p:InformationalVersion=${{ env.tag }} --output .\build

      - name: Zip Plugin
        run: Compress-Archive -Path .\build\* -DestinationPath .\build\BossModReborn.zip

      - name: Publish Plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ./build/BossModReborn.zip
            ./build/BossModReborn.json
          token: ${{ secrets.GITHUB_TOKEN }}

